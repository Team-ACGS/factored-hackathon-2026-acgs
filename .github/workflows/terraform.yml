name: Terraform

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/terraform.yml
  push:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/terraform.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  checks:
    name: fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive infra

      - name: validate
        run: |
          set -euo pipefail
          for root in core prd; do
            echo "::group::$root"
            terraform -chdir="infra/environments/$root" init -backend=false
            terraform -chdir="infra/environments/$root" validate -no-color
            echo "::endgroup::"
          done

  plan:
    name: plan ${{ matrix.root }}
    needs: checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: terraform

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        root: [core, prd]

    defaults:
      run:
        working-directory: infra/environments/${{ matrix.root }}

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - run: terraform init

      - name: plan
        env:
          TF_VAR_github_app_pem: ${{ secrets.TF_GITHUB_APP_PEM }}
        run: |
          set -euo pipefail
          if ! terraform plan -no-color -lock-timeout=120s -out=tfplan > plan.log 2>&1; then
            grep -v ': Refreshing state\.\.\.' plan.log
            exit 1
          fi
          terraform show -no-color tfplan

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Plan: \`${{ matrix.root }}\`"
            echo
            if [ ! -f tfplan ]; then
              echo "No plan was produced; see the plan step."
              exit 0
            fi
            terraform show -no-color tfplan | grep -E '^Plan:|^No changes' | head -1
            echo
            terraform show -json tfplan | jq -r '.resource_changes[]? | select(.change.actions != ["no-op"] and .change.actions != ["read"]) | "- `\(.address)`: \(.change.actions | join(", "))"'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ github.event_name }}" != "pull_request" ] && ! terraform show -no-color tfplan | grep -q '^No changes'; then
            echo "::warning::${{ matrix.root }}: main and what is applied in AWS differ"
          fi
