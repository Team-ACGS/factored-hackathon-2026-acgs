[project]
name = "bankdata"
version = "0.1.0"
description = "Data pipeline and analysis for the LATAM bank dataset"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",
    "duckdb>=1.5",
    "pandas>=3.0",
    "pyarrow>=21",
    "python-dotenv>=1.1",
    "typer>=0.17",
]

[project.scripts]
bankdata = "bankdata.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bankdata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
