[project]
name = "bankdata"
version = "0.1.0"
description = "Data pipeline and analysis for the LATAM bank dataset, and the policy corpus build"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43",
    "clara-core",
    "duckdb>=1.5",
    "markdown-it-py==4.0.0",
    "pandas>=3.0",
    "pyarrow>=21",
    "pymupdf>=1.26",
    "python-dotenv>=1.1",
    "pyyaml>=6.0",
    "typer>=0.17",
    "weasyprint>=66",
]

[project.scripts]
bankdata = "bankdata.cli:app"
build-policies = "bankdata.policies.cli:build_app"
tune-policies = "bankdata.policies.cli:tune_app"

[dependency-groups]
dev = [
    "boto3-stubs[bedrock-runtime,s3,s3vectors]>=1.43",
    "mypy>=2.3",
    "pandas-stubs>=2.3",
    "pytest>=8.4",
    "ruff>=0.16",
    "types-pyyaml>=6.0",
]

[tool.uv.sources]
clara-core = { path = "../lambdas/core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bankdata"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "S", "DTZ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/bankdata/duck.py" = ["S608"]
"src/bankdata/pipeline/*.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
explicit_package_bases = true
mypy_path = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*", "weasyprint", "weasyprint.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers"]
pythonpath = ["tests"]
testpaths = ["tests"]
