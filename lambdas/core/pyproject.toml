[project]
name = "clara-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-lambda-powertools[tracer]>=3.35",
    "boto3>=1.43",
    "pydantic>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
