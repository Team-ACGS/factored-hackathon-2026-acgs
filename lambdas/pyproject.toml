[project]
name = "clara-lambdas"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "clara-core",
    "clara-auth",
    "clara-crud",
    "clara-messages",
    "clara-chat-notifier",
    "clara-chatbot",
]

[dependency-groups]
dev = [
    "boto3-stubs[bedrock-runtime,dynamodb,dynamodbstreams,events,s3vectors,sqs,sts]>=1.43",
    "moto[dynamodb,events,sqs,sts]>=5.2",
    "mypy>=2.3",
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "auth", "crud", "messages", "chat_notifier", "chatbot"]

[tool.uv.sources]
clara-core = { workspace = true }
clara-auth = { workspace = true }
clara-crud = { workspace = true }
clara-messages = { workspace = true }
clara-chat-notifier = { workspace = true }
clara-chatbot = { workspace = true }

[tool.ruff]
line-length = 110
src = [".", "tests", "core/src", "auth/src", "crud/src", "messages/src", "chat_notifier/src", "chatbot/src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "S", "DTZ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"build.py" = ["S603", "S607", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["build.py", "conftest.py", "tests", "core/src", "auth/src", "crud/src", "messages/src", "chat_notifier/src", "chatbot/src"]
exclude = ["/\\.venv/", "^dist/"]
explicit_package_bases = true
mypy_path = ["tests", "core/src", "auth/src", "crud/src", "messages/src", "chat_notifier/src", "chatbot/src"]

[[tool.mypy.overrides]]
module = ["moto", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers"]
pythonpath = ["tests", "."]
filterwarnings = ["error", "ignore:No application metrics to publish:UserWarning"]
testpaths = ["tests"]
